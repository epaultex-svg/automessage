<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automessage — Settings</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        width: 320px;
        margin: 0;
        font-family: "Google Sans", Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
        color: #202124;
        background: #fff;
        line-height: 1.4;
      }

      .header {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 16px;
        background: #1a73e8;
        color: #fff;
      }

      .header-icon {
        flex-shrink: 0;
        width: 22px;
        height: 22px;
        margin-top: 2px;
      }

      .header-icon svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .header-text h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .header-text p {
        margin: 2px 0 0;
        font-size: 12px;
        opacity: 0.92;
        font-weight: 400;
      }

      .main {
        padding: 16px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 8px;
      }

      .field:last-of-type {
        margin-bottom: 0;
      }

      label {
        font-size: 12px;
        font-weight: 500;
        color: #5f6368;
      }

      input[type="password"],
      input[type="text"],
      select {
        width: 100%;
        padding: 8px 10px;
        font-size: 14px;
        font-family: inherit;
        color: #202124;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #fff;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      input::placeholder {
        color: #80868b;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: #1a73e8;
        box-shadow: 0 0 0 1px #1a73e8;
      }

      .help-link {
        font-size: 12px;
      }

      .help-link a {
        color: #1a73e8;
        text-decoration: none;
      }

      .help-link a:hover {
        text-decoration: underline;
      }

      .hint {
        margin: 0;
        font-size: 12px;
        color: #5f6368;
      }

      #status {
        display: none;
        margin-top: 12px;
        font-size: 12px;
        padding: 8px 10px;
        border-radius: 4px;
      }

      #status.is-visible {
        display: block;
      }

      #status.status--error {
        color: #c5221f;
        background: #fce8e6;
      }

      #status.status--success {
        color: #137333;
        background: #e6f4ea;
      }

      #saveBtn {
        width: 100%;
        margin-top: 16px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 500;
        font-family: inherit;
        color: #fff;
        background: #1a73e8;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.15s ease, box-shadow 0.15s ease;
      }

      #saveBtn:hover {
        background: #1557b0;
        box-shadow: 0 1px 2px rgba(60, 64, 67, 0.3);
      }

      #saveBtn:focus {
        outline: none;
        box-shadow: 0 0 0 2px #fff, 0 0 0 4px #1a73e8;
      }

      #saveBtn:active {
        background: #174ea6;
      }

      .footer {
        margin: 12px 16px 16px;
        font-size: 11px;
        color: #5f6368;
        text-align: center;
      }
    </style>
    <script src="../dist/popup.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="header-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M4 6h16v12H4V6zm2 0 6 4 6-4M6 8.5V18h12V8.5"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <div class="header-text">
        <h1>Automessage</h1>
        <p>AI Reply Suggestions</p>
      </div>
    </header>

    <main class="main">
      <form id="settingsForm" autocomplete="off">
        <div class="field">
          <label for="apiKey">OpenRouter API Key</label>
          <input
            id="apiKey"
            name="apiKey"
            type="password"
            placeholder="sk-or-..."
            spellcheck="false"
            autocomplete="off"
          />
          <div class="help-link">
            <a href="https://openrouter.ai/keys" target="_blank" rel="noopener noreferrer"
              >Get your API key →</a
            >
          </div>
        </div>

        <div class="field">
          <label for="model">Model</label>
          <input
            id="model"
            name="model"
            type="text"
            placeholder="openai/gpt-4o-mini"
            spellcheck="false"
          />
          <p class="hint">Any model on OpenRouter</p>
        </div>

        <div class="field">
          <label for="tone">Reply Tone</label>
          <select id="tone" name="tone">
            <option value="professional">professional</option>
            <option value="friendly">friendly</option>
            <option value="concise">concise</option>
          </select>
        </div>
      </form>

      <div id="status" role="status" aria-live="polite"></div>

      <button type="button" id="saveBtn">Save Settings</button>
    </main>

    <p class="footer">Settings are stored locally in your browser.</p>
  </body>
</html>
