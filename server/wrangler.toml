name = "automessage-proxy"
main = "src/worker.ts"
compatibility_date = "2024-08-21"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put`; never put real values here):
#   OPENROUTER_API_KEY
#   AUTOMESSAGE_SHARED_TOKEN
#   ALLOWED_EXTENSION_ID   (the chrome-extension:// ID of your packed extension)

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
